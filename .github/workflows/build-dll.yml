name: Build Xeno DLL

on:
  push:
    branches: [ claude/project-file-check-he1bay, main ]
  workflow_dispatch:

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          C:/vcpkg/installed
          C:/vcpkg/packages
        key: vcpkg-win-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          vcpkg-win-

    - name: Install dependencies via vcpkg
      run: |
        vcpkg install openssl:x64-windows curl:x64-windows nlohmann-json:x64-windows spdlog:x64-windows fmt:x64-windows lz4:x64-windows zstd:x64-windows cpp-httplib:x64-windows ixwebsocket:x64-windows

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -A x64

    - name: Build
      run: cmake --build build --config Release

    - name: List output
      run: |
        Get-ChildItem -Recurse build/ -Filter "*.dll" -ErrorAction SilentlyContinue
        Get-ChildItem -Recurse build/ -Filter "*.lib" -ErrorAction SilentlyContinue

    - name: Collect DLL and dependencies
      run: |
        New-Item -ItemType Directory -Force -Path artifact
        # Find and copy Xeno.dll
        $dll = Get-ChildItem -Recurse build/ -Filter "Xeno.dll" | Select-Object -First 1
        if ($dll) {
          Copy-Item $dll.FullName artifact/
          Write-Host "Found Xeno.dll at $($dll.FullName)"
        } else {
          Write-Host "WARNING: Xeno.dll not found in build output"
          Get-ChildItem -Recurse build/ -Filter "*.dll"
        }
        # Copy dependency DLLs from vcpkg installed dir
        $installed = "C:/vcpkg/installed/x64-windows/bin"
        if (Test-Path $installed) {
          Get-ChildItem "$installed/*.dll" | ForEach-Object {
            Copy-Item $_.FullName artifact/ -ErrorAction SilentlyContinue
            Write-Host "Copied dependency: $($_.Name)"
          }
        }

    - name: Upload DLL artifact
      uses: actions/upload-artifact@v4
      with:
        name: Xeno-DLL-x64
        path: artifact/
        if-no-files-found: warn
